<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 3 Digital - JSX Setup</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const user = "GrowthLift";
    const isLoggedIn = true;

    const UserGreeting = ({ name }) => <h2>Welcome, {name}!</h2>;
    const GuestGreeting = () => <h2>Please sign in.</h2>;

    const App = () => {
      return (
        <div>
          <h1>Week 3 Digital - JSX Setup</h1>
          {isLoggedIn ? <UserGreeting name={user} /> : <GuestGreeting />}
          <ul>
            <li>JSX expressions with curly braces</li>
            <li>Conditional rendering</li>
            <li>Component props</li>
          </ul>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
