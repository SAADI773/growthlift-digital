<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Basics - Operators</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 16px; border-radius: 8px; }
        .out { background: #eafaf1; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>JS Basics 2 - Operators</h1>
    <p>Arithmetic, comparison, logical, and string operators.</p>

    <script>
        // Arithmetic
        let a = 10, b = 3;
        const arith = `
            10 + 3 = ${a + b}
            10 - 3 = ${a - b}
            10 * 3 = ${a * b}
            10 / 3 = ${a / b}
            10 % 3 = ${a % b}   (remainder)
            10 ** 2 = ${a ** 2} (power)
        `;

        // Comparison -> boolean
        let x = 10, y = "10";
        const comp = `
            5 > 3          = ${5 > 3}
            5 < 3          = ${5 < 3}
            loose 10 == '10' = ${x == y}   (compares value)
            strict 10 === '10'= ${x === y} (compares type too)
            10 != 20       = ${x != 20}
            10 >= 10       = ${x >= 10}
        `;

        // Logical
        const logical = `
            true && false = ${true && false}
            true || false = ${true || false}
            !true         = ${!true}
        `;

        // String concatenation
        const concat = "Hello " + "World".toUpperCase();

        document.write(
            '<h2>Arithmetic</h2><div class="out"><pre>' + arith + '</pre></div>' +
            '<h2>Comparison</h2><div class="out"><pre>' + comp + '</pre></div>' +
            '<h2>Logical</h2><div class="out"><pre>' + logical + '</pre></div>' +
            '<h2>String concat</h2><div class="out">' + concat + '</div>'
        );
    </script>
</body>
</html>
