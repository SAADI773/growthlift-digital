<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Basics - Arrays &amp; Objects</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 16px; border-radius: 8px; }
        .out { background: #eafaf1; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>JS Basics 5 - Arrays &amp; Objects</h1>
    <p>Collections, their methods, object properties &amp; methods.</p>

    <script>
        // Arrays
        let fruits = ["apple", "mango", "pear"];
        fruits.push("banana");          // add to end
        fruits.pop();                   // remove last
        fruits.unshift("kiwi");         // add to front
        fruits.shift();                 // remove first
        const first = fruits[0];
        const index = fruits.indexOf("mango");
        const length = fruits.length;

        // Array methods
        const nums = [1, 2, 3, 4];
        const doubled = nums.map(n => n * 2);        // transform
        const evens = nums.filter(n => n % 2 === 0); // filter
        const total = nums.reduce((sum, n) => sum + n, 0); // accumulate

        // Objects
        const person = {
            first: "Ayaan",
            age: 25,
            greet() {
                return "Hi, I'm " + this.first;
            }
        };
        person.city = "Karachi";   // add property
        delete person.age;         // remove property

        const out = `
            fruits         = [${fruits}]
            first          = ${first}
            index of mango = ${index}
            length         = ${length}

            doubled        = [${doubled}]
            evens          = [${evens}]
            total          = ${total}

            person.first   = ${person.first}
            person.city    = ${person.city}
            person.greet() = ${person.greet()}
        `;

        document.write('<div class="out"><pre>' + out + '</pre></div>');
        console.log(out);
        console.log(person);
        console.log(fruits);
    </script>
</body>
</html>
