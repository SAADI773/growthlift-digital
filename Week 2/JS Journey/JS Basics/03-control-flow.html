<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Basics - Control Flow</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 16px; border-radius: 8px; }
        .out { background: #eafaf1; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>JS Basics 3 - Control Flow</h1>
    <p>if / else, switch, and loops (for, while, for...of).</p>

    <script>
        const log = [];
        const push = txt => log.push(txt);

        // if / else if / else
        let grade = 75;
        let verdict;
        if (grade >= 90) verdict = "A - Excellent";
        else if (grade >= 75) verdict = "B - Good";
        else if (grade >= 60) verdict = "C - Average";
        else verdict = "F - Fail";
        push("Grade " + grade + " => " + verdict);

        // switch
        let day = 5;
        let dayName;
        switch (day) {
            case 1: dayName = "Monday"; break;
            case 5: dayName = "Friday"; break;
            default: dayName = "Other day";
        }
        push("Day " + day + " => " + dayName);

        // for loop
        for (let i = 1; i <= 3; i++) {
            push("for loop i = " + i);
        }

        // while loop
        let count = 0;
        while (count < 2) {
            push("while count = " + count);
            count++;
        }

        // for...of over array
        const fruits = ["apple", "mango", "pear"];
        for (const fruit of fruits) {
            push("fruit: " + fruit);
        }

        document.write('<div class="out">' + log.map(l => l).join('<br>') + '</div>');
        log.forEach(l => console.log(l));
    </script>
</body>
</html>
