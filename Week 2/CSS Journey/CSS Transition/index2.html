<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <link rel="stylesheet" href="animation.css">
</head>
<body>

    <h1>CSS Animations</h1>
    <p class="hint">These run automatically without any interaction.</p>

    <div class="demo">
        <h2>1. Pulsing ball</h2>
        <p>Scales up and down forever.</p>
        <div class="ball pulse"></div>
    </div>

    <div class="demo">
        <h2>2. Moving box</h2>
        <p>Slides back and forth.</p>
        <div class="moving"></div>
    </div>

    <div class="demo">
        <h2>3. Infinite iterations</h2>
        <p>Spinner with iteration 3 then pause.</p>
        <div class="spinner"></div>
    </div>

    <div class="demo">
        <h2>4. Alternate direction</h2>
        <p>alternate toggles forward and reverse.</p>
        <div class="alt"></div>
    </div>

</body>
</html>
