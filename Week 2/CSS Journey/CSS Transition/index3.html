<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Keyframes</title>
    <link rel="stylesheet" href="keyframe.css">
</head>
<body>

    <h1>CSS Keyframe Animations</h1>
    <p class="hint">Multi-step animations defined with @keyframes.</p>

    <div class="demo">
        <h2>1. Rainbow color cycle</h2>
        <p>Changes color at each keyframe stopping point.</p>
        <div class="rainbow"></div>
    </div>

    <div class="demo">
        <h2>2. Bouncing ball</h2>
        <p>Position + scale keyframes combine.</p>
        <div class="field">
            <div class="bounce"></div>
        </div>
    </div>

    <div class="demo">
        <h2>3. Wrapping text buddy</h2>
        <p>Text fades in, slides, then fades out.</p>
        <div class="fade-box">Hello!</div>
    </div>

</body>
</html>
