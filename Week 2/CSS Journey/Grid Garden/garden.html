<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Garden</title>
    <link rel="stylesheet" href="garden.css">
</head>
<body>

    <h1>Grid Garden</h1>
    <p class="intro">A little garden patch built with CSS Grid rows.</p>

    <div class="garden">

        <!-- Sky section -->
        <div class="row sky-row">
            <div class="sun">&#9728;</div>
            <div class="cloud">Cloud</div>
        </div>

        <!-- Fence + plants row -->
        <div class="row plants-row">
            <div class="fence">F</div>
            <div class="plant rose">Rose</div>
            <div class="fence">F</div>
            <div class="plant tulip">Tulip</div>
            <div class="fence">F</div>
            <div class="plant daisy">Daisy</div>
            <div class="fence">F</div>
        </div>

        <!-- Soil rows with different cells -->
        <div class="row soil-row">
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
        </div>

        <div class="row soil-row">
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
            <div class="soil">soil</div>
        </div>

        <!-- Watering row -->
        <div class="row water-row">
            <div class="water">&#9748; Water</div>
            <div class="shovel">Shovel</div>
            <div class="water">&#9748; Water</div>
        </div>

    </div>

</body>
</html>
